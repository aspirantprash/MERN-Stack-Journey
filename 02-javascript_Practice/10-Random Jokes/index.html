
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JokeBox | Random Jokes Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page-wrapper">

        <!-- Navbar -->
        <header class="navbar">
            <a href="#" class="logo">
                <span class="logo-icon">😄</span>
                <span>JokeBox<span class="dot">.</span></span>
            </a>

            <span class="nav-tag">YOUR DAILY DOSE OF FUN</span>
        </header>

        <!-- Main Section -->
        <main class="main-content">

            
            <!-- Joke Card -->
            <section class="joke-card">

                <div class="card-top">
                    <span class="joke-category">
                        <span>😂</span>Developer JOKES
                    </span>

                    <span class="joke-number">#001</span>
                </div>

                <div class="joke-illustration">
                    <span class="spark spark-one">✦</span>
                    <span class="spark spark-two">✧</span>
                    <div class="smile-face">😎</div>
                    <span class="spark spark-three">✦</span>
                </div>

                <div class="joke-content">
                    <h2>Why do programmers prefer dark mode?</h2>

                    <p>
                        Because light attracts bugs! 🐛
                    </p>
                </div>

                <div class="card-divider"></div>

                <button class="joke-button" type="button">
                    <span>↻</span>
                    Tell Me Another Joke
                </button>

                <!-- <p class="button-hint">
                    Go on, give that button some love.
                </p> -->

            </section>

            <!--Bottom Info -->
            <div class="bottom-info">
                <div class="info-item">
                    <span class="info-icon">⚡</span>
                    <span>Quick laughs</span>
                </div>

                <span class="info-separator">•</span>

                <div class="info-item">
                    <span class="info-icon">💛</span>
                    <span>Good vibes only</span>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>Made by Prashant <span>♥</span> with a little sense of humor.</p>
            
        </footer>

    </div>

</body>
<script src="script.js"></script>
</html>
