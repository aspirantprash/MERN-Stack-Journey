<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Student | Campusly</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f7fc;
      --surface: #ffffff;
      --text: #28243c;
      --muted: #77748b;
      --purple: #7665dc;
      --purple-light: #eeeaff;
      --border: #e9e7f0;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px 18px;
      visibility: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    .page {
      width: min(760px, 100%);
      margin: 0 auto;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .brand span {
      color: var(--purple);
    }

    .back-link {
      padding: 10px 14px;
      border-radius: 12px;
      background: var(--purple-light);
      color: var(--purple);
      font-size: 0.9rem;
      font-weight: 700;
      text-decoration: none;
    }

    .form-card {
      padding: clamp(22px, 5vw, 40px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      box-shadow: 0 12px 34px rgb(36 39 74 / 7%);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 1.3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -1px;
    }

    .intro {
      margin: 10px 0 28px;
      color: var(--muted);
      line-height: 1.6;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field-wide {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.92rem;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    input:focus,
    select:focus {
      border-color: var(--purple);
      outline: 3px solid rgb(118 101 220 / 16%);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 28px;
    }

    .button {
      display: inline-flex;
      min-height: 46px;
      align-items: center;
      justify-content: center;
      padding: 0 18px;
      border: 0;
      border-radius: 11px;
      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }

    .button-secondary {
      background: #f1f0f5;
      color: var(--text);
    }

    .button-primary {
      background: var(--purple);
      color: #fff;
    }

    .message-area {
      min-height: 24px;
      margin: 18px 0 0;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .message-area.success {
      color: #16835d;
    }

    .message-area.error {
      color: #c43d52;
    }

    @media (max-width: 560px) {
      body {
        padding: 20px 13px;
      }

      .form-grid {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .field-wide {
        grid-column: auto;
      }

      .form-actions {
        flex-direction: column-reverse;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">Campus<span>ly</span></div>
      <a class="back-link" href="index.html">Back to Dashboard</a>
    </header>

    <section class="form-card" aria-labelledby="page-title">
      <p class="eyebrow">Student management</p>
      <h1 id="page-title">Add a student</h1>
      <p class="intro">Enter the student's details and academic information.</p>

      <form action="#" method="post" id="student-form">
        <div class="form-grid">
          <div class="field">
            <label for="student-name">Student Name</label>
            <input id="student-name" name="studentName" type="text" autocomplete="name" placeholder="Enter full name" required>
          </div>

          <div class="field">
            <label for="roll-number">Roll Number</label>
            <input id="roll-number" name="rollNumber" type="text" placeholder="Enter roll number" required>
          </div>

          <div class="field">
            <label for="email">Email Address</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="student@example.com" required>
          </div>

          <div class="field">
            <label for="phone">Phone Number</label>
            <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="Enter phone number" required>
          </div>

          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option value="" selected disabled>Select gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="field">
            <label for="course">Course</label>
            <select id="course" name="course" required>
              <option value="BCA" selected>BCA</option>
              <option value="B.Tech">B.Tech</option>
              <option value="B.Sc IT">B.Sc IT</option>
              <option value="MCA">MCA</option>
              <option value="M.Tech">M.Tech</option>
            </select>
          </div>

          <div class="field">
            <label for="academic-year">Academic Year</label>
            <select id="academic-year" name="academicYear" required>
              <option value="" selected disabled>Select academic year</option>
              <option value="1st Year">1st Year</option>
              <option value="2nd Year">2nd Year</option>
              <option value="3rd Year">3rd Year</option>
              <option value="4th Year">4th Year</option>
            </select>
          </div>

          <div class="field">
            <label for="semester">Semester</label>
            <select id="semester" name="semester" required>
              <option value="" selected disabled>Select semester</option>
              <option value="Semester 1">Semester 1</option>
              <option value="Semester 2">Semester 2</option>
              <option value="Semester 3">Semester 3</option>
              <option value="Semester 4">Semester 4</option>
              <option value="Semester 5">Semester 5</option>
              <option value="Semester 6">Semester 6</option>
              <option value="Semester 7">Semester 7</option>
              <option value="Semester 8">Semester 8</option>
            </select>
          </div>
        </div>

        <div class="form-actions">
          <button class="button button-secondary" type="reset">Reset</button>
          <button class="button button-primary" type="submit">Add student</button>
        </div>
        <div class="message-area" id="form-message" role="status" aria-live="polite" aria-label="Success or error message"></div>
      </form>
    </section>
  </main>

  
<script src="add-student.js"></script>

</body>
</html>
