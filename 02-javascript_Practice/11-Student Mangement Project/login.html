<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Login | Campusly</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8f7fc;
      --surface: #ffffff;
      --text: #28243c;
      --muted: #77748b;
      --purple: #7665dc;
      --purple-light: #eeeaff;
      --border: #e9e7f0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", "Segoe UI", sans-serif;
    }

    .login-card {
      width: min(420px, 100%);
      padding: 36px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(40, 36, 60, 0.08);
    }

    .brand {
      margin-bottom: 28px;
      color: var(--text);
      font-size: 24px;
      font-weight: 800;
    }

    .brand span {
      color: var(--purple);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--purple);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: 28px;
    }

    .intro {
      margin: 10px 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font: inherit;
    }

    input:focus {
      border-color: var(--purple);
      outline: 3px solid var(--purple-light);
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: var(--purple);
      color: white;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #6654cd;
    }

    .message {
      min-height: 22px;
      margin: 14px 0 0;
      color: #b42318;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">Campus<span>ly</span></div>
    <p class="eyebrow">Authorized staff</p>
    <h1>Sign in</h1>
    <p class="intro">Enter your staff credentials to access student management.</p>

    <form id="login-form">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" type="text" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Continue</button>
      <p class="message" id="login-message" role="alert" aria-live="polite"></p>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
