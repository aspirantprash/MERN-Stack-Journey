<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Modern Digital Clock</title>

    <link rel="stylesheet" href="style.css" />

  </head>
  <body>

    <div class="clock-app">

      <div class="clock-card">

        <p class="tagline">Current time</p>

        <h1>Digital Clock</h1>

        <div class="display-panel">

          <div class="display active" id="time-wrapper">
            <h2 id="time">00:00:00 AM</h2>
          </div>

          <div class="display" id="date-wrapper">
            <h2 id="date">1 January 2026</h2>
          </div>

        </div>

        <div class="button-group">

          <button id="btn" class="primary-btn">Show Time</button>
          <button id="btnDate" class="secondary-btn">Show Date</button>

        </div>
        
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
